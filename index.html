<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>(주)비에스알이앤지 - 경보회로 및 계기교정 시험성적서 자동화 시스템</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans KR & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bsr: {
              navy: '#0F2C59',
              blue: '#1E40AF',
              light: '#EFF6FF',
              dark: '#0B1E3F',
              accent: '#2563EB',
              gray: '#475569'
            }
          },
          fontFamily: {
            sans: ['Noto Sans KR', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    /* CSS Reset & Screen Layout setup */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #0f172a;
      color: #334155;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* Screen Preview Layout */
    #app-container {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Editor Sidebar */
    #editor-sidebar {
      width: 440px;
      min-width: 440px;
      background: #1e293b;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #334155;
      z-index: 20;
    }

    /* Preview Desk Container */
    #preview-wrapper {
      flex: 1;
      overflow-y: auto;
      background: #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px 80px 20px;
      position: relative;
    }

    /* A4 Screen Visual Page Representation */
    .a4-page {
      width: 210mm;
      height: 296.2mm;
      background: #ffffff;
      color: #0f172a;
      margin: 0 auto 30px auto;
      padding: 11mm 12mm 10mm 12mm;
      position: relative;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3), 0 0 0 1px rgba(0,0,0,0.05);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      page-break-after: always;
      break-after: page;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    /* Watermark Styling */
    .watermark-layer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-32deg);
      font-size: 38pt;
      font-weight: 800;
      color: rgba(15, 44, 89, 0.04);
      pointer-events: none;
      white-space: nowrap;
      user-select: none;
      z-index: 1;
    }

    /* Standard Table Base Specs */
    .report-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 8.5pt;
    }
    .report-table th, .report-table td {
      border: 1px solid #64748b;
      padding: 0 3px;
      vertical-align: middle;
      box-sizing: border-box;
    }
    .report-table th {
      background-color: #f1f5f9;
      color: #0f2c59;
      font-weight: 700;
      text-align: center;
      padding: 3px 2px;
    }

    /* Section 2: Alarm Circuit Table - Exact height & 오와열 통일 */
    .alarm-table tbody tr {
      height: 6.45mm !important;
      max-height: 6.45mm !important;
    }
    .alarm-table td {
      font-size: 8.2pt;
      line-height: 1.15;
    }

    /* Section 3: Calibration Table - Center aligned & Exact height */
    .calib-table tbody tr {
      height: 6.05mm !important;
      max-height: 6.05mm !important;
    }
    .calib-table th, .calib-table td {
      text-align: center !important;
      vertical-align: middle !important;
      font-size: 8pt;
      padding: 0 2px;
      font-variant-numeric: tabular-nums;
    }

    /* Number & Monospace tabular tweaks */
    .num-font {
      font-family: 'JetBrains Mono', 'Noto Sans KR', monospace;
      font-variant-numeric: tabular-nums;
    }

    /* TOC Leaders (Horizontal dotted line) */
    .toc-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 14px;
      font-size: 11pt;
    }
    .toc-title {
      white-space: nowrap;
      flex-shrink: 0;
      font-weight: 600;
      color: #0f2c59;
    }
    .toc-dots {
      flex: 1;
      border-bottom: 1.5px dotted #94a3b8;
      margin: 0 12px;
      position: relative;
      top: -4px;
    }
    .toc-page {
      white-space: nowrap;
      flex-shrink: 0;
      font-weight: 700;
      color: #1e40af;
      font-family: 'JetBrains Mono', monospace;
    }

    /* -----------------------------------------------------------------
       CRITICAL MULTI-PAGE PRINT STYLES (@media print)
       ----------------------------------------------------------------- */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      
      html, body {
        width: 210mm !important;
        height: auto !important;
        min-height: 0 !important;
        max-height: none !important;
        overflow: visible !important;
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Hide editor UI chrome completely */
      .no-print, #editor-sidebar, #top-toolbar, .modal, button, .ui-controls {
        display: none !important;
      }

      /* Reset app layout wrappers so browser breaks pages naturally */
      #app-container, #main-layout, #preview-wrapper, #report-pages {
        display: block !important;
        position: static !important;
        width: 210mm !important;
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 0 !important;
        transform: none !important;
        background: none !important;
        box-shadow: none !important;
      }

      /* Precise A4 Page Box in Print */
      .a4-page {
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        position: relative !important;
        width: 210mm !important;
        height: 296.2mm !important; /* Standard A4 height */
        margin: 0 !important;
        padding: 11mm 12mm 10mm 12mm !important;
        box-sizing: border-box !important;
        box-shadow: none !important;
        border: none !important;
        overflow: hidden !important;
        page-break-after: always !important;
        break-after: page !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        background: #ffffff !important;
      }

      .a4-page:last-child {
        page-break-after: auto !important;
        break-after: auto !important;
      }

      /* Ensure print table borders remain solid slate */
      .report-table th, .report-table td {
        border-color: #475569 !important;
      }
    }
  </style>
</head>
<body>

  <!-- App Wrapper -->
  <div id="app-container">

    <!-- LEFT SIDEBAR: EDITOR & DATA MANAGEMENT PANEL (no-print) -->
    <aside id="editor-sidebar" class="no-print">
      <!-- Sidebar Header -->
      <div class="p-4 bg-bsr-dark border-b border-slate-700 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded bg-blue-600 flex items-center justify-center font-bold text-white text-sm">BSR</div>
          <div>
            <h1 class="font-bold text-sm text-white leading-tight">성적서 자동화 시스템</h1>
            <p class="text-xs text-slate-400">(주)비에스알이앤지</p>
          </div>
        </div>
        <span class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded font-mono">v4.5 A4</span>
      </div>

      <!-- Navigation Tabs -->
      <div class="flex border-b border-slate-700 bg-slate-900/60 text-xs font-medium">
        <button onclick="switchTab('basic')" id="tab-btn-basic" class="flex-1 py-2.5 px-2 text-center text-blue-400 border-b-2 border-blue-500 font-semibold bg-slate-800/80">1. 기본/갑지</button>
        <button onclick="switchTab('alarm')" id="tab-btn-alarm" class="flex-1 py-2.5 px-2 text-center text-slate-400 hover:text-slate-200">2. 경보회로</button>
        <button onclick="switchTab('calib')" id="tab-btn-calib" class="flex-1 py-2.5 px-2 text-center text-slate-400 hover:text-slate-200">3. 계기교정</button>
        <button onclick="switchTab('switch')" id="tab-btn-switch" class="flex-1 py-2.5 px-2 text-center text-slate-400 hover:text-slate-200">4. 스위치류</button>
      </div>

      <!-- Tab Content Area -->
      <div class="flex-1 overflow-y-auto p-4 space-y-4 text-xs">

        <!-- TAB 1: BASIC & COVER INFO -->
        <div id="tab-content-basic" class="space-y-4">
          <div class="bg-slate-800/60 border border-slate-700 rounded-lg p-3 space-y-3">
            <h3 class="font-bold text-slate-200 text-sm flex items-center gap-1.5 border-b border-slate-700 pb-2">
              <i data-lucide="building" class="w-4 h-4 text-blue-400"></i> 현장 및 발주처 정보
            </h3>
            <div>
              <label class="block text-slate-400 mb-1">현장명 1줄 (상단)</label>
              <input type="text" id="inp-siteLine1" oninput="updateData('basic', 'siteLine1', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500">
            </div>
            <div>
              <label class="block text-slate-400 mb-1">현장명 2줄 (하단/부제목)</label>
              <input type="text" id="inp-siteLine2" oninput="updateData('basic', 'siteLine2', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-slate-400 mb-1">설비 대표 프리셋</label>
                <select id="inp-facilityPreset" onchange="applyFacilityPreset(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500">
                  <option value="증기터빈 발전기">증기터빈 발전기</option>
                  <option value="가스터빈 발전기">가스터빈 발전기</option>
                  <option value="가스엔진 발전기">가스엔진 발전기</option>
                  <option value="보일러 설비">보일러 설비</option>
                  <option value="풍력 발전설비">풍력 발전설비</option>
                  <option value="수배전·전기설비">수배전·전기설비</option>
                  <option value="custom">직접 입력</option>
                </select>
              </div>
              <div>
                <label class="block text-slate-400 mb-1">설비약칭 (헤더용)</label>
                <input type="text" id="inp-facilityShort" oninput="updateData('basic', 'facilityShort', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500">
              </div>
            </div>
            <div>
              <label class="block text-slate-400 mb-1">보고서 풀 타이틀 (갑지/목차용)</label>
              <input type="text" id="inp-facilityTitle" oninput="updateData('basic', 'facilityTitle', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500">
            </div>
          </div>

          <div class="bg-slate-800/60 border border-slate-700 rounded-lg p-3 space-y-3">
            <h3 class="font-bold text-slate-200 text-sm flex items-center gap-1.5 border-b border-slate-700 pb-2">
              <i data-lucide="calendar" class="w-4 h-4 text-blue-400"></i> 진단일자 및 서명 정보
            </h3>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-slate-400 mb-1">진단 날짜</label>
                <input type="date" id="inp-testDate" onchange="updateData('basic', 'testDate', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500">
              </div>
              <div>
                <label class="block text-slate-400 mb-1">시험 종별</label>
                <input type="text" id="inp-testType" oninput="updateData('basic', 'testType', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-slate-400 mb-1">진단 총괄 책임자</label>
                <input type="text" id="inp-chief" oninput="updateData('basic', 'chief', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500">
              </div>
              <div>
                <label class="block text-slate-400 mb-1">책임/실무 시험원</label>
                <input type="text" id="inp-testers" oninput="updateData('basic', 'testers', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-slate-400 mb-1">고객사 입회/확인자</label>
                <input type="text" id="inp-clientConfirmer" oninput="updateData('basic', 'clientConfirmer', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500">
              </div>
              <div>
                <label class="block text-slate-400 mb-1">사용 계측기 명칭</label>
                <input type="text" id="inp-equipment" oninput="updateData('basic', 'equipment', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500">
              </div>
            </div>
          </div>

          <div class="bg-slate-800/60 border border-slate-700 rounded-lg p-3 space-y-2">
            <h3 class="font-bold text-slate-200 text-sm flex items-center gap-1.5 border-b border-slate-700 pb-2">
              <i data-lucide="file-text" class="w-4 h-4 text-blue-400"></i> 점검결과서 종합의견
            </h3>
            <textarea id="inp-overallOpinion" rows="4" oninput="updateData('basic', 'overallOpinion', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-slate-100 focus:outline-none focus:border-blue-500 font-sans"></textarea>
          </div>
        </div>

        <!-- TAB 2: ALARM CIRCUITS -->
        <div id="tab-content-alarm" class="space-y-4 hidden">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-slate-200 text-sm">경보회로 데이터 관리</h3>
            <div class="flex gap-1.5">
              <button onclick="addAlarmItem()" class="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded flex items-center gap-1">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i> 항목 추가
              </button>
            </div>
          </div>

          <div class="bg-blue-950/40 border border-blue-800/50 p-2.5 rounded text-blue-300 space-y-2">
            <p class="font-semibold text-xs flex items-center gap-1">
              <i data-lucide="wand2" class="w-4 h-4 text-blue-400"></i> 자동 동기화 기능
            </p>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="autoGenerateCalibFromAlarms()" class="bg-blue-900/80 hover:bg-blue-800 border border-blue-700 text-white py-1.5 px-2 rounded font-medium text-center transition">
                계기교정 성적서로 자동 생성
              </button>
              <button onclick="autoGenerateSwitchesFromAlarms()" class="bg-indigo-900/80 hover:bg-indigo-800 border border-indigo-700 text-white py-1.5 px-2 rounded font-medium text-center transition">
                스위치류 기록표 자동 생성
              </button>
            </div>
          </div>

          <div id="alarm-items-list" class="space-y-3">
            <!-- Dynamic Alarm Items Rendered Here -->
          </div>
        </div>

        <!-- TAB 3: INSTRUMENT CALIBRATION -->
        <div id="tab-content-calib" class="space-y-4 hidden">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-slate-200 text-sm">계기교정 데이터 관리</h3>
            <button onclick="addCalibItem()" class="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded flex items-center gap-1">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> 계기 추가
            </button>
          </div>

          <div id="calib-items-list" class="space-y-3">
            <!-- Dynamic Calibration Items Rendered Here -->
          </div>
        </div>

        <!-- TAB 4: SWITCH CHECK SHEETS -->
        <div id="tab-content-switch" class="space-y-4 hidden">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-slate-200 text-sm">스위치류 점검기록표 관리</h3>
            <button onclick="addSwitchItem()" class="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded flex items-center gap-1">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> 스위치 추가
            </button>
          </div>

          <div id="switch-items-list" class="space-y-3">
            <!-- Dynamic Switch Items Rendered Here -->
          </div>
        </div>

      </div>

      <!-- Sidebar Footer Data Actions -->
      <div class="p-3 bg-slate-900 border-t border-slate-700 flex flex-wrap gap-2 text-xs">
        <button onclick="loadGumiSampleData()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-blue-300 py-1.5 px-2 rounded font-semibold flex items-center justify-center gap-1">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> 구미 샘플 로드
        </button>
        <button onclick="resetDataEmpty()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 py-1.5 px-2 rounded flex items-center justify-center">
          새 문서
        </button>
        <button onclick="exportJSON()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 py-1.5 px-2 rounded">
          JSON 저장
        </button>
        <label class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 py-1.5 px-2 rounded cursor-pointer text-center">
          불러오기
          <input type="file" id="json-file-input" accept=".json" onchange="importJSON(event)" class="hidden">
        </label>
      </div>
    </aside>

    <!-- MAIN RIGHT CONTENT: TOP TOOLBAR & LIVE A4 PREVIEW DESK -->
    <main class="flex-1 flex flex-direction-col flex-col overflow-hidden bg-slate-900">
      
      <!-- Top Control Toolbar (no-print) -->
      <header id="top-toolbar" class="no-print bg-slate-800 border-b border-slate-700 px-6 py-3 flex items-center justify-between text-white shadow-md z-10">
        <div class="flex items-center gap-6">
          <span class="font-bold text-sm text-slate-200 flex items-center gap-2">
            <i data-lucide="file-check" class="w-5 h-5 text-blue-400"></i> 보고서 실시간 미리보기
          </span>
          <!-- Page & Section Counters -->
          <div class="flex items-center gap-3 text-xs bg-slate-900/80 px-3 py-1.5 rounded-full border border-slate-700">
            <span class="text-slate-400">총 페이지: <strong id="lbl-total-pages" class="text-blue-400 font-mono">19</strong>장</span>
            <span class="text-slate-600">|</span>
            <span class="text-slate-400">경보회로: <strong id="lbl-alarm-pages" class="text-emerald-400 font-mono">1</strong>장</span>
            <span class="text-slate-600">|</span>
            <span class="text-slate-400">계기교정: <strong id="lbl-calib-pages" class="text-amber-400 font-mono">1</strong>장</span>
          </div>
        </div>

        <div class="flex items-center gap-4 text-xs">
          <!-- Toggles -->
          <label class="flex items-center gap-1.5 text-slate-300 cursor-pointer select-none">
            <input type="checkbox" id="chk-fillBlank" checked onchange="toggleFillBlank(this.checked)" class="rounded bg-slate-900 border-slate-600 text-blue-600 focus:ring-0">
            <span>빈 행으로 A4 끝까지 채우기</span>
          </label>
          <label class="flex items-center gap-1.5 text-slate-300 cursor-pointer select-none">
            <input type="checkbox" id="chk-watermark" checked onchange="toggleWatermark(this.checked)" class="rounded bg-slate-900 border-slate-600 text-blue-600 focus:ring-0">
            <span>워터마크 표시</span>
          </label>

          <!-- Zoom control -->
          <div class="flex items-center gap-1 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-300">
            <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400"></i>
            <select id="sel-zoom" onchange="setPreviewZoom(this.value)" class="bg-transparent focus:outline-none text-xs text-slate-200">

    /* =================================================================
       2. ENGINEERING CALCULATIONS ENGINE (RTD, TC, Transmitter)
       ================================================================= */
    
    // Callendar-Van Dusen & NIST Polynomials for accurate Sensor Physics
    function computePhysicsInput(sensorType, tempOrVal) {
      const t = parseFloat(tempOrVal);
      if (isNaN(t)) return { val: "-", unit: "" };

      if (sensorType === "RTD_PT100") {
        // IEC 60751 Callendar-Van Dusen: R(t) = 100 * (1 + A*t + B*t^2)
        const A = 3.9083e-3, B = -5.775e-7;
        let R = 100 * (1 + A * t + B * t * t);
        if (t < 0) {
          const C = -4.183e-12;
          R += 100 * C * (t - 100) * Math.pow(t, 3);
        }
        return { val: R.toFixed(2).replace(/\.00$/, ''), unit: "Ω" };
      }
      else if (sensorType === "RTD_JPT100") {
        // JIS C1604 JPt100: R0=100, A=3.9739e-3, B=-5.870e-7
        const A = 3.9739e-3, B = -5.870e-7;
        let R = 100 * (1 + A * t + B * t * t);
        return { val: R.toFixed(2).replace(/\.00$/, ''), unit: "Ω" };
      }
      else if (sensorType === "TC_K") {
        // NIST ITS-90 Type K Thermocouple Polynomial (0 to 500°C)
        const c = [0, 4.0374879e-2, 3.0510309e-5, -3.8944694e-8, 2.4744883e-11, -1.2104721e-14, 3.8219084e-18, -6.852084e-22, 5.460832e-26];
        let mV = 0;
        let t_pow = t;
        for (let i = 1; i < c.length; i++) {
          mV += c[i] * t_pow;
          t_pow *= t;
        }
        if (t >= 0) {
          mV += 0.1185976 * Math.exp(-0.000118343 * Math.pow(t - 126.9686, 2));
        }
        return { val: mV.toFixed(2), unit: "mV" };
      }
      else if (sensorType === "TC_J") {
        // NIST Type J Polynomial (0 to 760°C)
        const c = [0, 5.0381187e-2, 3.0475836e-5, -8.5681065e-8, 1.3228195e-10, -1.7052958e-13, 1.1737701e-16, -3.5578033e-20];
        let mV = 0;
        let t_pow = t;
        for (let i = 1; i < c.length; i++) {
          mV += c[i] * t_pow;
          t_pow *= t;
        }
        return { val: mV.toFixed(2), unit: "mV" };
      }
      else if (sensorType === "TX_4_20MA") {
        return { val: tempOrVal, unit: "mA" };
      }
      else if (sensorType === "TX_1_5V") {
        return { val: tempOrVal, unit: "V" };
      }
      else if (sensorType === "TX_0_10V") {
        return { val: tempOrVal, unit: "V" };
      }
      return { val: tempOrVal, unit: "" };
    }

    // Generate 5 Calibration Test Points (0%, 25%, 50%, 75%, 100%)
    function calculateCalibPoints(item) {
      const min = parseFloat(item.minVal) || 0;
      const max = parseFloat(item.maxVal) || 100;
      const offset = parseFloat(item.offset) || 0;
      const pctList = [0, 0.25, 0.5, 0.75, 1.0];

      return pctList.map(p => {
        const stdOutNum = min + (max - min) * p;
        // Clean round to avoid floating artifacts (e.g., 9.524999999 -> 9.525)
        const stdOutStr = (Math.round(stdOutNum * 1000) / 1000).toString();
        
        let stdInStr = "";
        let stdInUnit = "";

        if (item.sensorType === "TX_4_20MA") {
          const ma = 4 + 16 * p;
          stdInStr = ma.toFixed(2).replace(/\.00$/, '');
          stdInUnit = "mA";
        } else if (item.sensorType === "TX_1_5V") {
          const v = 1 + 4 * p;
          stdInStr = v.toFixed(2).replace(/\.00$/, '');
          stdInUnit = "V";
        } else if (item.sensorType === "TX_0_10V") {
          const v = 10 * p;
          stdInStr = v.toFixed(2).replace(/\.00$/, '');
          stdInUnit = "V";
        } else {
          const phys = computePhysicsInput(item.sensorType, stdOutNum);
          stdInStr = phys.val;
          stdInUnit = phys.unit;
        }

        const preOutNum = stdOutNum + offset;
        const preOutStr = (Math.round(preOutNum * 1000) / 1000).toString();

        return {
          pct: Math.round(p * 100) + "%",
          stdIn: stdInStr,
          stdInUnit: stdInUnit,
          stdOut: stdOutStr,
          preIn: stdInStr,
          preOut: preOutStr,
          postIn: stdInStr,
          postOut: stdOutStr
        };
      });
    }

    function formatKoreanDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);

      return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;

    function getSensorLabel(type) {
      switch (type) {
        case 'RTD_PT100': return 'RTD (Pt100)';
        case 'RTD_JPT100': return 'RTD (JPt100)';
        case 'TC_K': return 'TC (K Type)';
        case 'TC_J': return 'TC (J Type)';
        case 'TX_4_20MA': return 'Transmitter (4~20mA)';
        case 'TX_1_5V': return 'Transmitter (1~5V)';
        case 'TX_0_10V': return 'Transmitter (0~10V)';
        default: return type;
      }
    }

      appState.alarmItems[idx][field] = val;

    function updateInterlock(itemIdx, ilkIdx, field, val) {
      appState.alarmItems[itemIdx].interlocks[ilkIdx][field] = val;
      if (field === 'design' && !appState.alarmItems[itemIdx].interlocks[ilkIdx].val) {
        appState.alarmItems[itemIdx].interlocks[ilkIdx].val = val;
      }
      renderReport();
      saveToLocalStorage();
    }

    function addInterlock(itemIdx) {
      appState.alarmItems[itemIdx].interlocks.push({ type: "H Alarm", design: "0", val: "0", result: "양호" });
      renderAlarmEditorList();
      renderReport();
      saveToLocalStorage();
    }

    function removeInterlock(itemIdx, ilkIdx) {
      if (appState.alarmItems[itemIdx].interlocks.length <= 1) return;
      appState.alarmItems[itemIdx].interlocks.splice(ilkIdx, 1);
      renderAlarmEditorList();
      renderReport();
      saveToLocalStorage();
    }

      const nextId = appState.alarmItems.length + 1;
      appState.alarmItems.push({
        id: nextId,
        name: `신규 경보 항목 ${nextId}`,
        tag: `PT-${100 + nextId}`,
        unit: "bar",
        note: "-",
        interlocks: [{ type: "H Alarm", design: "10.0", val: "10.0", result: "양호" }]
      });
      renderAlarmEditorList();
      renderReport();
      saveToLocalStorage();
    }

      appState.alarmItems.splice(idx, 1);
      appState.alarmItems.forEach((item, i) => item.id = i + 1);
      renderAlarmEditorList();
      renderReport();
      saveToLocalStorage();

      appState.calibItems.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'bg-slate-800/80 border border-slate-700 rounded-lg p-3 space-y-2';
        card.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-700 pb-1.5">
            <span class="font-bold text-emerald-400">#${item.id} ${item.tag || ''}</span>
            <button onclick="deleteCalibItem(${idx})" class="text-slate-400 hover:text-red-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
          </div>
          <div class="grid grid-cols-3 gap-1.5">
            <input type="text" value="${item.name}" onchange="updateCalib(${idx}, 'name', this.value)" placeholder="명칭" class="col-span-2 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100">
            <input type="text" value="${item.tag}" onchange="updateCalib(${idx}, 'tag', this.value)" placeholder="기기번호" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100">
          </div>
          <div class="grid grid-cols-2 gap-1.5">
            <div>
              <label class="text-[10px] text-slate-400">센서 종류</label>
              <select onchange="updateCalib(${idx}, 'sensorType', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-1.5 py-1 text-slate-100">
                <option value="RTD_PT100" ${item.sensorType === 'RTD_PT100' ? 'selected' : ''}>RTD (Pt100)</option>
                <option value="RTD_JPT100" ${item.sensorType === 'RTD_JPT100' ? 'selected' : ''}>RTD (JPt100)</option>
                <option value="TC_K" ${item.sensorType === 'TC_K' ? 'selected' : ''}>TC (K Type)</option>
                <option value="TC_J" ${item.sensorType === 'TC_J' ? 'selected' : ''}>TC (J Type)</option>
                <option value="TX_4_20MA" ${item.sensorType === 'TX_4_20MA' ? 'selected' : ''}>Transmitter (4~20mA)</option>
                <option value="TX_1_5V" ${item.sensorType === 'TX_1_5V' ? 'selected' : ''}>Transmitter (1~5V)</option>
                <option value="TX_0_10V" ${item.sensorType === 'TX_0_10V' ? 'selected' : ''}>Transmitter (0~10V)</option>
              </select>
            </div>
            <div>
              <label class="text-[10px] text-slate-400">출력 단위</label>
              <input type="text" value="${item.outUnit}" onchange="updateCalib(${idx}, 'outUnit', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100">
            </div>
          </div>
          <div class="grid grid-cols-3 gap-1.5">
            <div>
              <label class="text-[10px] text-slate-400">Min Range</label>
              <input type="number" value="${item.minVal}" onchange="updateCalib(${idx}, 'minVal', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100">
            </div>
            <div>
              <label class="text-[10px] text-slate-400">Max Range</label>
              <input type="number" value="${item.maxVal}" onchange="updateCalib(${idx}, 'maxVal', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100">
            </div>
            <div>
              <label class="text-[10px] text-slate-400">교정전 오차</label>
              <input type="number" step="0.01" value="${item.offset}" onchange="updateCalib(${idx}, 'offset', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-amber-300">
            </div>
          </div>
        `;
        container.appendChild(card);
      });
      if (window.lucide) lucide.createIcons();
    }

    function updateCalib(idx, field, val) {
      appState.calibItems[idx][field] = val;
      renderReport();
      saveToLocalStorage();
    }

    function addCalibItem() {
      const nextId = appState.calibItems.length + 1;
      appState.calibItems.push({
        id: nextId,
        name: `신규 계기 ${nextId}`,
        tag: `TT-${200 + nextId}`,
        sensorType: "RTD_PT100",
        minVal: 0,
        maxVal: 200,
        outUnit: "℃",
        offset: 0,
        result: "양호"
      });
      renderCalibEditorList();
      renderReport();
      saveToLocalStorage();
    }

    function deleteCalibItem(idx) {
      appState.calibItems.splice(idx, 1);
      appState.calibItems.forEach((item, i) => item.id = i + 1);
      renderCalibEditorList();
      renderReport();
      saveToLocalStorage();
    }

    // Render Editor Switches Tab
    function renderSwitchEditorList() {
      const container = document.getElementById('switch-items-list');
      container.innerHTML = '';

      appState.switches.forEach((sw, idx) => {
        const card = document.createElement('div');
        card.className = 'bg-slate-800/80 border border-slate-700 rounded-lg p-3 space-y-2';
        card.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-700 pb-1.5">
            <span class="font-bold text-amber-400">#${idx + 1} ${sw.tag}</span>
            <button onclick="deleteSwitchItem(${idx})" class="text-slate-400 hover:text-red-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
          </div>
          <div class="grid grid-cols-3 gap-1.5">
            <input type="text" value="${sw.tag}" onchange="updateSwitch(${idx}, 'tag', this.value)" placeholder="Tag No" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100">
            <input type="text" value="${sw.category}" onchange="updateSwitch(${idx}, 'category', this.value)" placeholder="구분" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100">
            <input type="text" value="${sw.name}" onchange="updateSwitch(${idx}, 'name', this.value)" placeholder="기기명" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100">
          </div>
          <div class="grid grid-cols-2 gap-1.5">
            <input type="text" value="${sw.location}" onchange="updateSwitch(${idx}, 'location', this.value)" placeholder="설치위치" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100">
            <input type="text" value="${sw.range}" onchange="updateSwitch(${idx}, 'range', this.value)" placeholder="Range" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-100">
          </div>
          <div class="grid grid-cols-4 gap-1.5">
            <input type="text" value="${sw.setVal}" onchange="updateSwitch(${idx}, 'setVal', this.value)" placeholder="Set값" class="bg-slate-900 border border-slate-700 rounded px-1.5 py-1 text-slate-100">
            <select onchange="updateSwitch(${idx}, 'typeDir', this.value)" class="bg-slate-900 border border-slate-700 rounded px-1 py-1 text-slate-100">
              <option value="up" ${sw.typeDir === 'up' ? 'selected' : ''}>상승↑</option>
              <option value="down" ${sw.typeDir === 'down' ? 'selected' : ''}>하강↓</option>
            </select>
            <input type="text" value="${sw.preSet}" onchange="updateSwitch(${idx}, 'preSet', this.value)" placeholder="교정전" class="bg-slate-900 border border-slate-700 rounded px-1.5 py-1 text-slate-100">
            <input type="text" value="${sw.postSet}" onchange="updateSwitch(${idx}, 'postSet', this.value)" placeholder="교정후" class="bg-slate-900 border border-slate-700 rounded px-1.5 py-1 text-slate-100">
          </div>
        `;
        container.appendChild(card);
      });
      if (window.lucide) lucide.createIcons();
    }

    function updateSwitch(idx, field, val) {
      appState.switches[idx][field] = val;
      renderReport();
      saveToLocalStorage();
    }

    function addSwitchItem() {
      const nextId = appState.switches.length + 1;
      appState.switches.push({
        id: nextId,
        tag: `PS-${200 + nextId}`,
        category: "압력스위치",
        name: "신규 압력 스위치",
        location: "메인 배관",
        range: "0 ~ 10 [bar]",
        mfr: "Switzer",
        model: "734.B1",
        setVal: "5.00",
        typeDir: "down",
        unit: "bar",
        contact: "NC",
        preSet: "4.95",
        postSet: "5.00",
        resistance: "0.1",
        leak: "양호"
      });
      renderSwitchEditorList();
      renderReport();
      saveToLocalStorage();
    }

    function deleteSwitchItem(idx) {
      appState.switches.splice(idx, 1);
      appState.switches.forEach((item, i) => item.id = i + 1);
      renderSwitchEditorList();
      renderReport();
      saveToLocalStorage();
    }

    /* =================================================================
       6. ONE-CLICK AUTO-SYNCHRONIZATION ENGINE
       ================================================================= */
    
    function autoGenerateCalibFromAlarms() {
      const newCalibs = [];
      let cId = 1;

      appState.alarmItems.forEach(alarm => {
        const tagUpper = alarm.tag.toUpperCase();
        let sensorType = "TX_4_20MA";
        let minV = 0, maxV = 100;

        if (tagUpper.startsWith("TT")) {
          sensorType = "TC_K";
          maxV = 600;
        } else if (tagUpper.startsWith("RTD")) {
          sensorType = "RTD_PT100";
          maxV = 200;
        } else if (tagUpper.startsWith("VX")) {
          sensorType = "TX_4_20MA";
          maxV = 12.7;
        } else if (tagUpper.startsWith("PT")) {
          sensorType = "TX_4_20MA";
          maxV = 25;
        } else if (tagUpper.startsWith("PS")) {
          return; // Skip pressure switches for calibration table
        }

        newCalibs.push({
          id: cId++,
          name: alarm.name,
          tag: alarm.tag,
          sensorType: sensorType,
          minVal: minV,
          maxVal: maxV,
          outUnit: alarm.unit || "℃",
          offset: 0,
          result: "양호"
        });
      });

      if (newCalibs.length > 0) {
        appState.calibItems = newCalibs;
        renderCalibEditorList();
        renderReport();
        saveToLocalStorage();
        alert(`경보회로 항목을 바탕으로 ${newCalibs.length}개의 계기교정 목록이 자동 생성되었습니다.`);
      }
    }

    function autoGenerateSwitchesFromAlarms() {
      const newSwitches = [];
      let sId = 1;

      appState.alarmItems.forEach(alarm => {
        const tagUpper = alarm.tag.toUpperCase();
        if (tagUpper.startsWith("PS") || tagUpper.startsWith("TS") || tagUpper.startsWith("LS")) {
          const mainIlk = alarm.interlocks[0] || { type: "L Alarm", design: "1.0" };
          const isDown = mainIlk.type.includes("L");
          const setV = mainIlk.design || "1.00";

          newSwitches.push({
            id: sId++,
            tag: alarm.tag,
            category: tagUpper.startsWith("TS") ? "온도스위치" : "압력스위치",
            name: alarm.name,
            location: "현장 설치 배관",
            range: `0 ~ ${(parseFloat(setV) * 2 || 10)} [${alarm.unit}]`,
            mfr: "Switzer",
            model: "734.B1",
            setVal: setV,
            typeDir: isDown ? "down" : "up",
            unit: alarm.unit,
            contact: isDown ? "NC" : "NO",
            preSet: (parseFloat(setV) * 0.99).toFixed(2),
            postSet: setV,
            resistance: "0.1",
            leak: "양호"
          });
        }
      });

      if (newSwitches.length > 0) {
        appState.switches = newSwitches;
        renderSwitchEditorList();
        renderReport();
        saveToLocalStorage();
        alert(`경보회로 항목에서 스위치 ${newSwitches.length}개를 감지하여 기록표를 자동 생성하였습니다.`);
      } else {
        alert("경보회로 목록에 스위치 기기번호(PS-, TS-, LS-)가 존재하지 않습니다.");
      }
    }

    /* =================================================================
       7. UI INTERACTION, CONTROLS & LOCALSTORAGE
       ================================================================= */
    
    function switchTab(tabName) {
      ['basic', 'alarm', 'calib', 'switch'].forEach(t => {
        const btn = document.getElementById(`tab-btn-${t}`);
        const cnt = document.getElementById(`tab-content-${t}`);
        if (t === tabName) {
          btn.className = "flex-1 py-2.5 px-2 text-center text-blue-400 border-b-2 border-blue-500 font-semibold bg-slate-800/80";
          cnt.classList.remove('hidden');
        } else {
          btn.className = "flex-1 py-2.5 px-2 text-center text-slate-400 hover:text-slate-200";
          cnt.classList.add('hidden');
        }
      });
    }

    function toggleFillBlank(val) {
      config.fillBlankRows = val;
      renderReport();
    }

    function toggleWatermark(val) {
      config.showWatermark = val;
      renderReport();
    }

    function setPreviewZoom(zoomVal) {
      config.zoom = parseFloat(zoomVal);
      const reportWrap = document.getElementById('report-pages');
      reportWrap.style.transform = `scale(${config.zoom})`;
    }

    function triggerPrint() {
      window.print();
    }

    function saveToLocalStorage() {
      try {
        localStorage.setItem('bsr_report_data_v4', JSON.stringify(appState));
      } catch (e) {}
    }

    function loadGumiSampleData() {
      appState = JSON.parse(JSON.stringify(GUMI_DEFAULT_DATA));
      initEditorValues();
      saveToLocalStorage();
    }

    function resetDataEmpty() {
      if (confirm("모든 데이터를 초기화하고 빈 양식을 생성하시겠습니까?")) {
        appState = {
          basic: {
            siteLine1: "신규 사업장 명칭",
            siteLine2: "자가용 발전시설",
            facilityPreset: "custom",
            facilityTitle: "경보회로 및 계기교정 진단 결과 보고서",
            facilityShort: "발전설비",
            testDate: new Date().toISOString().split('T')[0],
            testType: "정기 안전진단",
            chief: "진단책임자",
            testers: "시험원",
            clientConfirmer: "입회자",
            equipment: "FLUKE 754",
            overallOpinion: "설비 점검 및 교정 결과 양호함."
          },
          alarmItems: [],
          calibItems: [],
          switches: []
        };
        initEditorValues();
        saveToLocalStorage();
      }
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `BSR_Report_${appState.basic.facilityShort}_${appState.basic.testDate}.json`);
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.basic && parsed.alarmItems) {
            appState = parsed;
            initEditorValues();
            saveToLocalStorage();
            alert("성공적으로 데이터를 불러왔습니다.");
          }
        } catch (err) {
          alert("유효하지 않은 JSON 파일 format입니다.");
        }
      };
      reader.readAsText(file);
    }

    // App Initialization on Window Load
    window.onload = function() {
      const saved = localStorage.getItem('bsr_report_data_v4');
      if (saved) {
        try {
          appState = JSON.parse(saved);
        } catch(e) {
          appState = JSON.parse(JSON.stringify(GUMI_DEFAULT_DATA));
        }
      } else {
        appState = JSON.parse(JSON.stringify(GUMI_DEFAULT_DATA));
      }

      initEditorValues();
    };
  </script>
</body>
