  <style>
    * {
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }
    
    /* Screen View Styles */
    body {
      background-color: #0f172a;
      color: #334155;
    }

    /* Printable Page Styles */
    .report-page {
      width: 210mm;
      min-height: 297mm;
      height: 297mm;
      padding: 14mm 14mm 12mm 14mm;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      margin: 0 auto 24px auto;
      overflow: hidden;
      page-break-after: always;
      break-after: page;
    }

    /* Watermark */
    .watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-32deg);
      font-size: 52pt;
      font-weight: 900;
      color: #0f2c59;
      pointer-events: none;
      user-select: none;
      z-index: 0;
      white-space: nowrap;
      letter-spacing: 2px;
    }

    /* TOC Strict Layout Fix */
    .toc-row {
      display: flex;
      align-items: baseline;
      width: 100%;
      margin-bottom: 22px;
      font-size: 14.5px;
      font-weight: 600;
      color: #1e293b;
    }
    .toc-title {
      white-space: nowrap !important;
      flex-shrink: 0 !important;
      font-weight: 700;
    }
    .toc-leader {
      flex: 1 1 auto !important;
      min-width: 24px !important;
      border-bottom: 1.5px dotted #94a3b8 !important;
      margin: 0 14px !important;
      align-self: center;
      height: 1px;
    }
    .toc-page {
      white-space: nowrap !important;
      flex-shrink: 0 !important;
      font-weight: 700;
      color: #0f2c59;
    }

    /* Standard Report Tables */
    .report-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px;
      text-align: center;
      line-height: 1.3;
    }
    .report-table th, .report-table td {
      border: 1px solid #64748b;
      padding: 4px 5px;
      word-break: keep-all;
    }
    .report-table th {
      background-color: #f1f5f9;
      color: #0f2c59;
      font-weight: 700;
    }

    /* Dense mode for larger tables */
    .report-table-dense th, .report-table-dense td {
      padding: 3px 3px;
      font-size: 9.5px;
    }

    /* Print Controls */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      body {
        background: white !important;
        padding: 0 !important;
        margin: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print {
        display: none !important;
      }
      .print-area {
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .report-page {
        width: 210mm !important;
        height: 297mm !important;
        padding: 14mm 14mm 12mm 14mm !important;
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
        page-break-after: always !important;
        break-after: page !important;
        overflow: hidden !important;
        box-sizing: border-box !important;
      }
      .report-page:last-child {
        page-break-after: auto !important;
        break-after: auto !important;
      }
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const loaded = JSON.parse(e.target.result);
          state = loaded;
          saveStateToStorage();
          syncInputsFromState();
          renderAll();
          alert("JSON 데이터를 성공적으로 불러왔습니다.");
        } catch (err) {
          alert("JSON 파일 형식이 올바르지 않습니다.");
        }
      };
      reader.readAsText(file);
    }

    // ==========================================
    // INSTRUMENT PHYSICS MATH ENGINE
    // ==========================================
    // Callendar-Van Dusen & NIST TC Formulas
    function calcSensorStandardValue(type, rangeMin, rangeMax, percent) {
      const min = parseFloat(rangeMin) || 0;
      const max = parseFloat(rangeMax) || 100;
      const val = min + (max - min) * (percent / 100.0);

      if (type === 'RTD (Pt100)') {
        // IEC 60751 Pt100 equation for t >= 0
        const R0 = 100.0;
        const A = 3.9083e-3;
        const B = -5.775e-7;
        const r = R0 * (1 + A * val + B * val * val);
        return { inVal: r.toFixed(2), outVal: val.toFixed(1), inUnit: 'Ω' };
      } else if (type === 'RTD (JPt100)') {
        // JIS C 1604 JPt100 equation
        const R0 = 100.0;
        const A = 3.9739e-3;
        const B = -5.870e-7;
        const r = R0 * (1 + A * val + B * val * val);
        return { inVal: r.toFixed(2), outVal: val.toFixed(1), inUnit: 'Ω' };
      } else if (type === 'Thermo Couple (K Type)') {
        // NIST ITS-90 K-Type mV Polynomial approximation for 0 ~ 1372 C
        const t = val;
        const c0 = 0.0, c1 = 0.04047464, c2 = 4.3168685e-5, c3 = -1.1712952e-7;
        const c4 = 2.4566113e-10, c5 = -3.0019283e-13, c6 = 2.6322926e-16;
        const mv = c0 + c1*t + c2*t*t + c3*Math.pow(t,3) + c4*Math.pow(t,4) + c5*Math.pow(t,5) + c6*Math.pow(t,6);
        return { inVal: mv.toFixed(2), outVal: val.toFixed(1), inUnit: 'mV' };
      } else if (type === 'Thermo Couple (J Type)') {
        const t = val;
        const c0 = 0.0, c1 = 0.050381187, c2 = 3.0475881e-5, c3 = -8.5681065e-8, c4 = 1.3228195e-10;
        const mv = c0 + c1*t + c2*t*t + c3*Math.pow(t,3) + c4*Math.pow(t,4);
        return { inVal: mv.toFixed(2), outVal: val.toFixed(1), inUnit: 'mV' };
      } else if (type === 'Transmitter (4~20mA)') {
        const ma = 4.0 + (16.0 * (percent / 100.0));
        return { inVal: ma.toFixed(2), outVal: val.toFixed(1), inUnit: 'mA' };
      } else if (type === 'Transmitter (1~5V)') {
        const v = 1.0 + (4.0 * (percent / 100.0));
        return { inVal: v.toFixed(2), outVal: val.toFixed(1), inUnit: 'V' };
      } else if (type === 'Transmitter (0~10V)') {
        const v = 10.0 * (percent / 100.0);
        return { inVal: v.toFixed(2), outVal: val.toFixed(1), inUnit: 'V' };
      }
      return { inVal: val.toFixed(1), outVal: val.toFixed(1), inUnit: '-' };
    }

    function autoGenerateInstrumentsFromAlarms() {
      let added = 0;
      state.alarmItems.forEach(alarm => {
        const tagUpper = alarm.tag.toUpperCase();
        if (tagUpper.startsWith('TT') || tagUpper.startsWith('RTD') || tagUpper.startsWith('VX') || tagUpper.startsWith('PT') || tagUpper.startsWith('LT')) {
          const exists = state.instItems.some(i => i.tag === alarm.tag);
          if (!exists) {
            let type = "RTD (Pt100)";
            let min = 0, max = 200;
            if (tagUpper.startsWith('TT')) { type = "Thermo Couple (K Type)"; max = 600; }
            else if (tagUpper.startsWith('VX')) { type = "Transmitter (4~20mA)"; max = 12.7; }
            else if (tagUpper.startsWith('PT')) { type = "Transmitter (4~20mA)"; max = 25; }
            else if (tagUpper.startsWith('LT')) { type = "Transmitter (4~20mA)"; max = 100; }

            state.instItems.push({
              id: Date.now() + Math.random(),
              name: alarm.name,
              tag: alarm.tag,
              type: type,
              min: min,
              max: max,
              unit: alarm.unit,
              inUnit: (type.includes('RTD') ? 'Ω' : (type.includes('Thermo') ? 'mV' : 'mA')),
              offset: 0.1,
              result: "양호"
            });
            added++;
          }
        }
      });
      saveStateToStorage();
      renderAll();
      alert(`${added}개의 계기교정 항목이 자동으로 추가되었습니다.`);
    }

    // ==========================================
    // PREVIEW REPORT PAGE GENERATOR & PAGINATION
    // ==========================================
    function renderAll() {
      // 1. Update Editors
      renderAlarmEditors();
      renderInstEditors();
      renderSwitchEditors();

      // 2. Compute Pagination Breakdown
      // Alarm circuit pagination (Max 18 interlock sub-rows per page)
      let alarmPages = [];
      let currentAlarmPageRows = [];
      let currentAlarmRowCount = 0;

      state.alarmItems.forEach(item => {
        const itemSubCount = item.interlocks.length;
        if (currentAlarmRowCount + itemSubCount > 18 && currentAlarmPageRows.length > 0) {
          alarmPages.push(currentAlarmPageRows);
          currentAlarmPageRows = [];
          currentAlarmRowCount = 0;
        }
        currentAlarmPageRows.push(item);
        currentAlarmRowCount += itemSubCount;
      });
      if (currentAlarmPageRows.length > 0) alarmPages.push(currentAlarmPageRows);
      if (alarmPages.length === 0) alarmPages.push([]);

      // Instrument Calibration pagination (Max 5 instruments per page)
      let instPages = [];
      for (let i = 0; i < state.instItems.length; i += 5) {
        instPages.push(state.instItems.slice(i, i + 5));
      }
      if (instPages.length === 0) instPages.push([]);

      // Switch Check Sheets (1 switch per page)
      let switchPages = state.switchItems;

      // Compute Total Page Count
      // Cover (1) + TOC (1) + Inspection Sheet (1) + Alarms (alarmPages.length) + Inst (instPages.length) + Switches (switchPages.length)
      const totalPages = 3 + alarmPages.length + instPages.length + switchPages.length;

      // Page Indices
      const tocPageNum = 1;
      const inspectPageNum = 2;
      const alarmStartPage = 3;
      const alarmEndPage = alarmStartPage + alarmPages.length - 1;

      const instStartPage = alarmEndPage + 1;
      const instEndPage = instStartPage + instPages.length - 1;

      const switchStartPage = instEndPage + 1;
      const switchEndPage = switchStartPage + switchPages.length - 1;

      // 3. Render HTML Pages
      const container = document.getElementById('report-container');
      let html = '';

      // -------------------------------------------------------------
      // COVER PAGE (PAGE 0 / COVER - UNNUMBERED)
      // -------------------------------------------------------------
      html += `
        <div class="report-page">
          ${renderWatermark()}
          <!-- Top Navy/Gold Accent Line -->
          <div class="w-full h-2.5 bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-800 rounded-t mb-6"></div>

            <div class="text-right">
              <span class="inline-block px-3 py-1 bg-slate-100 text-slate-700 font-bold text-xs rounded border border-slate-300">안전진단 전문기관</span>
              <div class="text-[10px] text-slate-500 mt-1">Doc No: ${state.docNo || 'BSR-20261022-01'}</div>
            </div>
          </div>

          <!-- Document Main Title -->
          <div class="my-auto text-center py-8">
            <div class="text-base font-extrabold text-blue-900 uppercase tracking-widest mb-2">${state.siteLine1 || ''} ${state.siteLine2 || ''}</div>
            <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight leading-tight border-y-2 border-blue-900 py-6 mb-12">
              [${state.facilityType || '설비'}] 경보회로·계기교정<br>진단 결과 보고서
            </h1>

            <!-- Center Metadata Card -->
            <div class="max-w-md mx-auto bg-slate-50 border border-slate-300 rounded-lg p-6 shadow-sm text-left">
              <table class="w-full text-xs text-slate-700 border-separate" style="border-spacing: 0 10px;">

    // Helper functions for template rendering
    function renderWatermark() {
      const op = (state.watermarkOpacity !== undefined ? state.watermarkOpacity : 8) / 100.0;
      return `<div class="watermark" style="opacity: ${op};">(주)비에스알이앤지</div>`;
    }

    function renderRunningHeader(pageNum, totalPages) {
      return `
        <div class="flex items-center justify-between border-b border-slate-400 pb-1.5 mb-2 text-[10px] text-slate-600 font-medium z-10">
          <div class="font-bold text-blue-900">BSR (주)비에스알이앤지 <span class="text-slate-400 font-normal">|</span> ${state.siteLine1 || ''} ${state.siteLine2 || ''}</div>
          <div class="font-mono">일자: ${formatCompactDate(state.diagDate)} &nbsp;|&nbsp; Page: ${pageNum} / ${totalPages}</div>
        </div>
      `;
    }

    function renderRunningFooter() {
      return `
        <div class="mt-auto border-t border-slate-300 pt-1.5 flex items-center justify-between text-[9.5px] text-slate-500 font-medium z-10">
          <div>(주)비에스알이앤지 BSR ENGINEERING CO., LTD.</div>
          <div class="text-slate-400">전기안전관리법 지정 진단기관</div>
        </div>
      `;
    }

    function formatKoreanDate(dateStr) {
      if (!dateStr) return '2026년 10월 22일';
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        return `${parts[0]}년 ${parseInt(parts[1])}월 ${parseInt(parts[2])}일`;
      }
      return dateStr;
    }

    function formatCompactDate(dateStr) {
      if (!dateStr) return '2026. 10. 22.';
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        return `${parts[0]}. ${parts[1]}. ${parts[2]}.`;
      }
      return dateStr;
    }

    function formatYearMonth(dateStr) {
      if (!dateStr) return '2026년 10월';
      const parts = dateStr.split('-');
      if (parts.length >= 2) {
        return `${parts[0]}년 ${parseInt(parts[1])}월`;
      }
      return dateStr;
    }

    function formatPageRange(start, end) {
      if (start === end) return `Page ${start}`;
      return `Page ${start} ~ ${end}`;
    }

    function calcResetVal(setvalStr) {
      if (!setvalStr) return '-';
      const num = parseFloat(setvalStr);
      if (isNaN(num)) return setvalStr;
      const unit = setvalStr.replace(/[0-9\.]/g, '').trim();
      const resetNum = (num * 1.05).toFixed(2);
      return `${resetNum} ${unit}`;
    }
  </script>
